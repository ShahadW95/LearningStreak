<rect x="108" y="116" width="267" height="46" rx="23.0" fill="#FFFFFF09" stroke="#FFFFFF20" stroke-width="1"/><text x="241.5" y="145" font-size="12" fill="#E8D9CE" font-weight="600" text-anchor="middle" letter-spacing="1.4">A LITTLE LEARNING. EVERY DAY.</text><g transform="translate(110 239) scale(0.9)"><path d="M22 0C27 17 45 22 43 40C42 53 34 61 22 61C8 61 0 52 0 40C0 28 8 23 9 12C16 15 18 20 18 24C25 17 23 8 22 0Z" fill="#FF8F24"/><path d="M23 31C22 38 14 41 15 47C16 55 28 56 30 47C32 41 26 37 23 31Z" fill="#08090C"/></g><text x="110" y="388" font-size="76" fill="#FFFFFF" font-weight="750" letter-spacing="-3">LearningStreak</text><text x="113" y="455" font-size="42" fill="#FFF" font-weight="600" >One goal.</text><text x="113" y="510" font-size="42" fill="#FFF" font-weight="600" >One day at a time.</text><text x="114" y="576" font-size="21" fill="#B5B5C0" font-weight="400" >Build your learning rhythm with daily check-ins,</text><text x="114" y="609" font-size="21" fill="#B5B5C0" font-weight="400" >thoughtful freeze days, and a history that stays.</text><rect x="114" y="670" width="111" height="42" rx="21.0" fill="#FFFFFF08" stroke="#FFFFFF24" stroke-width="1"/><text x="169.5" y="696" font-size="16" fill="#E7E6EB" font-weight="500" text-anchor="middle">SwiftUI</text><rect x="237" y="670" width="113" height="42" rx="21.0" fill="#FFFFFF08" stroke="#FFFFFF24" stroke-width="1"/><text x="293.5" y="696" font-size="16" fill="#E7E6EB" font-weight="500" text-anchor="middle">Offline</text><rect x="362" y="670" width="154" height="42" rx="21.0" fill="#FFFFFF08" stroke="#FFFFFF24" stroke-width="1"/><text x="439.0" y="696" font-size="16" fill="#E7E6EB" font-weight="500" text-anchor="middle">Liquid Glass</text><rect x="114" y="804" width="52" height="3" rx="1.5" fill="url(#accent)"/><text x="114" y="843" font-size="13" fill="#A6A8B5" font-weight="600" letter-spacing="1.4">SET A GOAL  /  CHECK IN  /  LOOK BACK</text><g transform="translate(965 120) rotate(-9 158 330) scale(1.03)"