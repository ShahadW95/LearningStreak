<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390"><title>A learning day and its grace period</title><defs><linearGradient id="time" gradientUnits="userSpaceOnUse" x1="70" y1="183" x2="1080" y2="183"><stop stop-color="#FF8F24"/><stop offset=".75" stop-color="#FFB15B"/><stop offset="1" stop-color="#26C5E5"/></linearGradient></defs><rect width="1440" height="390" rx="24" fill="#111217"/><g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif"><text x="58" y="61" font-size="29" fill="#F7F7F8" font-weight="650" >A day to learn. A little room to recover.</text><text x="58" y="98" font-size="17" fill="#9B9DA8" font-weight="400" >Calendar-day tracking with an eight-hour grace period.</text><path d="M70 183H1360" stroke="#2D2F37" stroke-width="12" stroke-linecap="round"/><path d="M70 183H1080" stroke="url(#time)" stroke-width="12" stroke-linecap="round"/><path d="M830 171V195" stroke="#fff" stroke-width="2"/><circle cx="70" cy="183" r="10" fill="#FF8F24"/><circle cx="830" cy="183" r="10" fill="#FFB15B"/><circle cx="1080" cy="183" r="10" fill="#1FC2E3"/><circle cx="1360" cy="183" r="10" fill="#747783"/><text x="58" y="228" font-size="16" fill="#F7F7F8" font-weight="650" >MONDAY · 00:00</text><text x="58" y="260" font-size="16" fill="#A2A4AE" font-weight="400" >Your learning day begins.</text><text x="620" y="228" font-size="16" fill="#F7F7F8" font-weight="650" >TUESDAY · 00:00</text><text x="620" y="260" font-size="16" fill="#A2A4AE" font-weight="400" >No entry? Grace begins.</text><text x="1010" y="228" font-size="16" fill="#F7F7F8" font-weight="650" >TUESDAY · 08:00</text><text x="1010" y="260" font-size="16" fill="#A2A4AE" font-weight="400" >Still missing? Goal ends.</text><text x="58" y="337" font-size="17" fill="#FF8F24" font-weight="600" >Log or Freeze for Monday</text><text x="620" y="337" font-size="17" fill="#1FC2E3" font-weight="600" >Recover Monday before 08:00</text></g></svg>